<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="sucesso.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<title>Bem-vindo - VitaMove</title>

</head>

<body>

<div class="mensagem">

<h1>🎉 Bem-vindo à VitaMove!</h1>

<p id="nome"></p>

<p id="plano"></p>

<p>Entraremos em contato pelo telefone e email:</p>

<p id="telefone"></p>

<p id="email"></p>

<a href="index.html" class="btn">Voltar para aba inicial</a>

</div>


<script>

let nome = localStorage.getItem("nome")
let email = localStorage.getItem("email")
let telefone = localStorage.getItem("telefone")
let plano = localStorage.getItem("planoEscolhido")

document.getElementById("nome").innerHTML =
"<strong>" + nome + "</strong>, seu cadastro foi realizado com sucesso."

document.getElementById("plano").innerHTML =
"Plano escolhido: <strong>" + plano + "</strong>"

document.getElementById("telefone").innerHTML =
"📞 " + telefone

document.getElementById("email").innerHTML =
"📧 " + email

</script>

</body>

</html>
