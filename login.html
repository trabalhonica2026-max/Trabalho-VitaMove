<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<title>Login VitaMove</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial;
}

body{
background: url("./img.png/fundo-site.jpeg");
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:400px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
color:#0f5c3a;
}

.input-box{
display:flex;
flex-direction:column;
margin-bottom:20px;
}

.input-box input{
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

.btn{
background:#0f5c3a;
color:white;
border:none;
padding:12px;
border-radius:5px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.btn:hover{
background:#0b4229;
}

.erro{
color:red;
font-size:14px;
margin-bottom:10px;
display:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Entrar VitaMove</h1>

<form id="formLogin">

<div class="input-box">
<label>Nome Completo</label>
<input type="text" id="nome" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="input-box">
<label>CPF</label>
<input type="text" id="cpf" required>
</div>

<p class="erro" id="mensagemErro">Dados incorretos!</p>

<button type="submit" class="btn">Entrar</button>

</form>

</div>

<script>

document.getElementById("formLogin").addEventListener("submit", function(e){

e.preventDefault()

let nome = document.getElementById("nome").value
let email = document.getElementById("email").value
let cpf = document.getElementById("cpf").value

// Pegando dados salvos no cadastro
let nomeSalvo = localStorage.getItem("nome")
let emailSalvo = localStorage.getItem("email")
let cpfSalvo = localStorage.getItem("cpf")

// Validação simples
if(nome === nomeSalvo && email === emailSalvo && cpf === cpfSalvo){

// Login OK → vai para agendamentos
window.location.href = "agendamentos.html"

}else{

document.getElementById("mensagemErro").style.display = "block"

}

})

</script>

</body>
</html>
